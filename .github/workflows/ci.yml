name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  action-layer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: packages/action-layer
      # Builds first, then runs the compiled tests — so a type error fails CI
      # rather than surfacing at the moment an agent tries to act.
      - run: npm test
        working-directory: packages/action-layer

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm run build
        working-directory: client

  # Circadian (ventures/circadian) ships inside the same image. 3.11 because
  # that is the Python the image's Debian base installs.
  circadian-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r src/requirements.txt pytest httpx
        working-directory: ventures/circadian
      - run: python -m pytest -q src
        working-directory: ventures/circadian
        env:
          CIRCADIAN_SCHEDULER: 'off'

  # Happy Company (ventures/happycompany) is a Forge app; its tests need only
  # Node, and 22 because that is the Forge runtime the manifest declares.
  happycompany-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ventures/happycompany/package-lock.json
      # The frontend test compiles the UI Kit page and checks its imports
      # against the installed @forge/react, so dependencies are needed.
      - run: npm ci
        working-directory: ventures/happycompany
      - run: npm test
        working-directory: ventures/happycompany
