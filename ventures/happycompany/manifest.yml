# Happy Company — team load and burnout signals for Jira Cloud and Confluence Cloud.
#
# One Forge app, installed in both products. Each product runs its own copy with
# its own storage (Forge storage is per installation, and Atlassian does not let
# a Jira installation read a Confluence installation's data), so the Jira project
# page grades a project from Jira activity and the Confluence space page grades a
# space from Confluence activity. Both use the same scoring code in src/lib.
#
# No `remotes`, no `external` permissions, no fetch of anything outside Atlassian:
# that is what earns the "Runs on Atlassian" badge enterprise buyers filter on,
# and it is deliberate. Do not add an outbound call without reading PLAN.md first.
modules:
  jira:projectPage:
    - key: happycompany-jira-project-page
      resource: main
      resolver:
        function: resolver
      render: native
      title: Team health
      route: team-health
  confluence:spacePage:
    - key: happycompany-confluence-space-page
      resource: main
      resolver:
        function: resolver
      render: native
      title: Team health
      route: team-health
  # The organisation view for HR, health and safety and leadership. Access
  # is checked on every call (src/index.js): site administrators, plus the
  # groups they name. Confluence's page lives in global settings, which only
  # administrators can open.
  jira:globalPage:
    - key: happycompany-jira-org
      resource: org
      resolver:
        function: resolver
      render: native
      title: Working conditions across teams
  confluence:globalSettings:
    - key: happycompany-confluence-org
      resource: org
      resolver:
        function: resolver
      render: native
      title: Working conditions across spaces
  trigger:
    # Every event is reduced to "someone did something in this project at this
    # local hour" before it is stored. Nothing about the issue or page itself is
    # kept: no keys, titles, text or field values.
    - key: happycompany-jira-activity
      function: on-jira-event
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
        - avi:jira:commented:issue
        # Who was mentioned, without reading the comment. See SIGNALS.md C3.
        - avi:jira:mentioned:issue
    - key: happycompany-confluence-activity
      function: on-confluence-event
      events:
        - avi:confluence:created:page
        - avi:confluence:updated:page
        - avi:confluence:created:blogpost
        - avi:confluence:updated:blogpost
        - avi:confluence:created:comment
  scheduledTrigger:
    # Rolls day buckets into weekly aggregates, takes the daily open-work
    # snapshot in Jira, and deletes anything past its retention window.
    - key: happycompany-daily-rollup
      function: daily-rollup
      interval: day
  # Rovo, Atlassian's AI: an agent that answers "how are we doing, and what
  # should we change?" from the same team figures the page shows. Both
  # actions are read-only; the team action checks the asker can see the
  # project or space first (src/rovo.mjs).
  rovo:agent:
    - key: happycompany-agent
      name: Happy Company
      description: Explains a team's working conditions from Jira and Confluence activity, and what the team could change. Never about individuals.
      prompt: |
        You are Happy Company, an assistant for teams using the Happy Company app in Jira and Confluence.
        The app grades the working conditions of a team (a Jira project or a Confluence space) from A to E on five dimensions:
        hours and recovery, workload and pace, fragmentation, deadline pressure, and rework. It never grades a person.

        When someone asks how a team is doing, call the team working conditions action. Explain the grade, the trend,
        the dimensions that need attention, and the changes the app suggests, in plain words. Suggest that the team commits
        to one to three changes on the Team health page and says a week later whether they happened.

        When someone asks what the app measures, whether it watches them, or what it does with data, call the
        what-we-measure action and answer from it.

        Rules you always follow:
        - Never try to identify, compare, rank or evaluate individuals, and refuse requests to. The app has no individual data.
        - Always pass on the use ban the action returns: the figures may not be used in any decision about a person.
        - Suggest changes to how work is organised (planning, hand-offs, deadlines, on-call, meetings), never advice to
          individuals to cope better.
        - If a team shows "too few people", explain that this protects individuals and cannot be lowered.
        - You are not a medical or mental health service. If someone describes distress, say so kindly and point them to
          their organisation's employee assistance programme, occupational health service or a doctor.
        - The grade sees only Jira and Confluence activity. Say so when relevant, and mention the anonymous team pulse for
          what metadata cannot see.
      conversationStarters:
        - How is our team doing this week?
        - What should our team change first?
        - What does Happy Company measure about me?
      actions:
        - happycompany-team-health
        - happycompany-what-we-measure
  action:
    - key: happycompany-team-health
      name: Get team working conditions
      function: rovo-team-health
      actionVerb: GET
      description: The working-conditions grade, trend, dimensions and suggested changes for one Jira project or Confluence space. Team level only.
      inputs:
        projectKey:
          title: Jira project key
          type: string
          required: false
          description: The Jira project key, such as OPS. Leave empty to use the project the person is in.
        spaceId:
          title: Confluence space id
          type: string
          required: false
          description: The numeric Confluence space id. Leave empty to use the space the person is in.
    - key: happycompany-what-we-measure
      name: What Happy Company measures
      function: rovo-what-we-measure
      actionVerb: GET
      description: What the app measures, what it never measures, how people are protected, and the use ban.
  function:
    - key: rovo-team-health
      handler: index.rovoTeamHealth
    - key: rovo-what-we-measure
      handler: index.rovoWhatWeMeasure
    - key: resolver
      handler: index.handler
    - key: on-jira-event
      handler: index.onJiraEvent
    - key: on-confluence-event
      handler: index.onConfluenceEvent
    - key: daily-rollup
      handler: index.dailyRollup
      # A scheduled function may run up to 900 s. The rollup pages through
      # open issues per project, so it gets more than the 25 s default.
      timeoutSeconds: 600
resources:
  - key: main
    path: src/frontend/index.jsx
  - key: org
    path: src/frontend/org.jsx
app:
  runtime:
    name: nodejs22.x
  # `forge register` prints the real value. Deploying with this placeholder
  # fails on purpose rather than registering the app under someone else's id.
  id: ari:cloud:ecosystem::app/REPLACE-WITH-THE-ID-FROM-forge-register
  # Turn on before the paid Marketplace listing, never before: with licensing
  # enabled the app refuses to run on sites without a licence, including your
  # own development site until it is listed.
  # licensing:
  #   enabled: true
permissions:
  scopes:
    - storage:app
    - read:jira-work
    - read:jira-user
    - read:confluence-content.summary
    - read:confluence-space.summary
    - read:confluence-user
    # Write access is used for exactly two things, both off until a team or
    # site administrator turns them on: the weekly digest (a Jira issue
    # labelled happy-company, or a Confluence blog post) and the quarterly
    # evidence page. WORKS_COUNCIL.md says so.
    - write:jira-work
    - write:confluence-content
