<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Circadian">
<meta name="description" content="A jet lag plan for your flight: when to sleep, when to seek and avoid light, when coffee helps. Reminders on your phone, progress from WHOOP.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Circadian</title>
<style>
  :root {
    --night: #10131F;
    --surface: #1A1F33;
    --surface-2: #232A44;
    --rule: #2B3150;
    --ink: #EEF0F7;
    --muted: #9AA3BF;
    --dawn: #F2A65A;
    --dusk: #8A90F5;
    --sage: #6FCF97;
    --rose: #E58FA0;
    --danger: #F28B82;
  }
  * { box-sizing: border-box; }
  /* Component display rules would otherwise beat the hidden attribute. */
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--night); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
  }
  main { max-width: 560px; margin: 0 auto; padding-block: 20px 48px; display: grid; gap: 20px; }
  header { display: flex; align-items: center; gap: 12px; }
  header img { width: 36px; height: 36px; }
  header h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  h2 { font-size: 18px; margin: 0; }
  .card { background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
  .card > p { margin: 0; color: var(--muted); font-size: 14px; }
  form { display: grid; gap: 14px; }
  .leg { display: grid; gap: 12px; padding-bottom: 14px; border-bottom: 1px dashed var(--rule); }
  .leg:last-child { border-bottom: 0; padding-bottom: 0; }
  .leg-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  input, select {
    width: 100%; min-width: 0; font: inherit; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; appearance: none;
  }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--dawn); outline-offset: 2px; }
  input[type="checkbox"] { width: 20px; height: 20px; padding: 0; accent-color: var(--dawn); appearance: auto; }
  .check { display: flex; align-items: center; gap: 10px; color: var(--ink); font-size: 15px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  details[open] summary { margin-bottom: 12px; }
  .more { display: grid; gap: 14px; }
  button, .button {
    font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 13px 16px; cursor: pointer;
    background: var(--dawn); color: #1B1206; text-align: center; text-decoration: none; display: block;
  }
  button:disabled { opacity: .6; cursor: default; }
  .button.secondary, button.secondary { background: var(--surface-2); color: var(--ink); border: 1px solid var(--rule); }
  button.link { background: none; border: 0; padding: 0; color: var(--dawn); font-weight: 600; display: inline; }
  .error { color: var(--danger); font-size: 14px; margin: 0; }
  .ok { color: var(--sage); }
  .example { font-size: 13px; color: var(--muted); margin: 0; }
  #result { display: grid; gap: 16px; }
  .summary p { margin: 0; color: var(--muted); }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat { background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .day h3 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 600; letter-spacing: 0.02em; }
  .events { display: grid; gap: 8px; }
  .event { display: grid; grid-template-columns: 76px 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--rule); border-left-width: 4px; border-radius: 12px; padding: 10px 12px; }
  .event time { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; }
  .event time small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .event b { display: block; font-size: 15px; }
  .event span { color: var(--muted); font-size: 13px; }
  .event.now { box-shadow: 0 0 0 2px var(--dawn) inset; }
  .t-sleep { border-left-color: var(--dusk); }
  .t-light_seek { border-left-color: var(--dawn); }
  .t-light_avoid { border-left-color: #4A5277; }
  .t-melatonin { border-left-color: var(--rose); }
  .t-caffeine_ok { border-left-color: var(--sage); }
  .t-nap { border-left-color: var(--dusk); }
  .t-flight, .t-stopover { border-left-color: var(--ink); }
  .section-title { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 0; }
  .trips { display: grid; gap: 8px; }
  .trip { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
  .trip button { padding: 6px 10px; font-size: 14px; }
  .night { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding-block: 8px; border-top: 1px solid var(--rule); font-size: 14px; }
  .night:first-child { border-top: 0; }
  .night small { color: var(--muted); grid-column: 1 / -1; }
  .pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; align-self: start; }
  .pill.good { background: #1F3A2C; color: var(--sage); }
  .pill.off { background: #3A2A1F; color: var(--dawn); }
  .pill.none { background: var(--surface-2); color: var(--muted); }
  .disclaimer { font-size: 12px; color: var(--muted); margin: 0; }
  @media (max-width: 380px) { .row, .actions { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <img src="icon.svg" alt="">
    <div>
      <h1>Circadian</h1>
      <p>A jet lag plan for your flight.</p>
    </div>
  </header>

  <section class="card" id="trips-card" hidden>
    <h2>My trips</h2>
    <div class="trips" id="trips"></div>
  </section>

  <section class="card">
    <form id="trip" novalidate>
      <p class="example" id="example-note" hidden>An example trip, filled in to show how it works. Change it to yours.</p>
      <div id="legs"></div>
      <button type="button" class="secondary" id="add-leg">Add a connecting flight</button>
      <div class="row">
        <label for="sleep_start">Usual bedtime<input id="sleep_start" type="time" value="23:00"></label>
        <label for="sleep_end">Usual wake time<input id="sleep_end" type="time" value="07:00"></label>
      </div>
      <details>
        <summary>Return flight and more options</summary>
        <div class="more">
          <div class="row">
            <label for="return_departure">Flying back: departs<input id="return_departure" type="datetime-local"></label>
            <label for="return_arrival">Flying back: lands<input id="return_arrival" type="datetime-local"></label>
          </div>
          <label for="chronotype">Without an alarm, you would naturally
            <select id="chronotype">
              <option value="early">wake early (a morning person)</option>
              <option value="intermediate" selected>wake somewhere in between</option>
              <option value="late">sleep in (a night owl)</option>
            </select>
          </label>
          <label for="preflight_days">Start adjusting before you fly
            <select id="preflight_days">
              <option value="0">No, start when I land</option>
              <option value="1">1 day before</option>
              <option value="2" selected>2 days before</option>
              <option value="3">3 days before</option>
            </select>
          </label>
          <label class="check" for="melatonin"><input id="melatonin" type="checkbox" checked> Include melatonin timing</label>
          <label class="check" for="caffeine"><input id="caffeine" type="checkbox" checked> Include coffee timing</label>
        </div>
      </details>
      <p class="error" id="error" role="alert" hidden></p>
      <button type="submit" id="go">Make my plan</button>
    </form>
    <datalist id="zones"></datalist>
  </section>

  <section id="result" aria-live="polite"></section>
</main>

<template id="leg-template">
  <div class="leg">
    <div class="leg-head"><span class="leg-title">Flight 1</span><button type="button" class="link remove-leg" hidden>Remove</button></div>
    <div class="row">
      <label>From (city)<input class="from" list="zones" autocomplete="off" required></label>
      <label>To (city)<input class="to" list="zones" autocomplete="off" required></label>
    </div>
    <div class="row">
      <label>Departs, local time<input class="departure" type="datetime-local" required></label>
      <label>Lands, local time<input class="arrival" type="datetime-local" required></label>
    </div>
  </div>
</template>
<script src="app.js"></script>
</body>
</html>
